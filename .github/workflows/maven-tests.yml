name: Maven Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Run API tests
        run: mvn -pl api "-Dformatter.skip=true" test jacoco:report

      - name: Upload API coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: api/target/site/jacoco/
          if-no-files-found: error

  omod-security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Install API artifact for OMOD tests
        run: mvn -pl api "-Dformatter.skip=true" "-DskipTests" install

      - name: Run OMOD security regression tests
        run: mvn -pl omod "-Dformatter.skip=true" "-Dtest=AttachmentResourceTest,AttachmentRestControllerTest,AttachmentBytesResourceTest" "-Dsurefire.failIfNoSpecifiedTests=false" test jacoco:report

      - name: Upload OMOD security coverage report
        uses: actions/upload-artifact@v4
        with:
          name: omod-security-coverage-report
          path: omod/target/site/jacoco/
          if-no-files-found: error
