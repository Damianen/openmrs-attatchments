name: Snyk Security Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  snyk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Resolve Maven dependencies
        run: mvn clean install -DskipTests

      - name: Snyk Open Source scan (SCA)
        run: |
          set +e

          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo '{"ok":false,"scan":"sca","error":"SNYK_TOKEN is not configured","exitCode":2}' > snyk-sca.json
            exit 0
          fi

          snyk test --all-projects --json-file-output=snyk-sca.json
          status=$?

          if [ ! -s snyk-sca.json ]; then
            echo "{\"ok\":false,\"scan\":\"sca\",\"error\":\"Snyk CLI did not produce JSON output\",\"exitCode\":${status}}" > snyk-sca.json
          fi

          echo "Snyk SCA exit code: ${status}"
          exit 0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code scan (SAST)
        run: |
          set +e

          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo '{"ok":false,"scan":"sast","error":"SNYK_TOKEN is not configured","exitCode":2}' > snyk-code.json
            exit 0
          fi

          snyk code test --json-file-output=snyk-code.json
          status=$?

          if [ ! -s snyk-code.json ]; then
            echo "{\"ok\":false,\"scan\":\"sast\",\"error\":\"Snyk CLI did not produce JSON output\",\"exitCode\":${status}}" > snyk-code.json
          fi

          echo "Snyk Code exit code: ${status}"
          exit 0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: |
            snyk-sca.json
            snyk-code.json
          if-no-files-found: error
