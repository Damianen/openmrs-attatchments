name: Generate SBOM

on:
  push:
    branches:
      # Trigger workflow only for this branch
      - feat/sbom
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Resolve Maven dependencies
        run: mvn clean compile -DskipTests

      - name: Generate CycloneDX SBOM
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:2.7.10:makeAggregateBom -DoutputFormat=json -DoutputName=sbom.cdx

      - name: Prepare output and move to docs
        run: |
          mkdir -p docs
          mv target/sbom.cdx.json docs/sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: docs/sbom.cdx.json